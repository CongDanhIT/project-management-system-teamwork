<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" style="background-color: white; font-family: Arial, sans-serif;">
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="22" font-weight="bold" fill="#333">Comprehensive Log Distribution across Semantic Domains</text>
  
  <!-- Grid Lines (Y-axis) -->
  <line x1="100" y1="420" x2="850" y2="420" stroke="#ddd" stroke-dasharray="4,4" />
  <line x1="100" y1="340" x2="850" y2="340" stroke="#ddd" stroke-dasharray="4,4" />
  <line x1="100" y1="260" x2="850" y2="260" stroke="#ddd" stroke-dasharray="4,4" />
  <line x1="100" y1="180" x2="850" y2="180" stroke="#ddd" stroke-dasharray="4,4" />
  
  <!-- Grid Lines (X-axis) -->
  <line x1="250" y1="500" x2="250" y2="100" stroke="#ddd" stroke-dasharray="4,4" />
  <line x1="400" y1="500" x2="400" y2="100" stroke="#ddd" stroke-dasharray="4,4" />
  <line x1="550" y1="500" x2="550" y2="100" stroke="#ddd" stroke-dasharray="4,4" />
  <line x1="700" y1="500" x2="700" y2="100" stroke="#ddd" stroke-dasharray="4,4" />

  <!-- Axes -->
  <!-- Y-axis: 500 to 100 -->
  <!-- X-axis: 100 to 800 -->
  <line x1="100" y1="500" x2="850" y2="500" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="100" y1="500" x2="100" y2="80" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- Y-axis Ticks -->
  <text x="90" y="504" text-anchor="end" font-size="14" fill="#555">0.0</text>
  <line x1="95" y1="420" x2="100" y2="420" stroke="#333" stroke-width="2" />
  <text x="90" y="424" text-anchor="end" font-size="14" fill="#555">0.2</text>
  <line x1="95" y1="340" x2="100" y2="340" stroke="#333" stroke-width="2" />
  <text x="90" y="344" text-anchor="end" font-size="14" fill="#555">0.4</text>
  <line x1="95" y1="260" x2="100" y2="260" stroke="#333" stroke-width="2" />
  <text x="90" y="264" text-anchor="end" font-size="14" fill="#555">0.6</text>
  <line x1="95" y1="180" x2="100" y2="180" stroke="#333" stroke-width="2" />
  <text x="90" y="184" text-anchor="end" font-size="14" fill="#555">0.8</text>
  <line x1="95" y1="100" x2="100" y2="100" stroke="#333" stroke-width="2" />
  <text x="90" y="104" text-anchor="end" font-size="14" fill="#555">1.0</text>

  <!-- X-axis Ticks -->
  <text x="100" y="525" text-anchor="middle" font-size="14" fill="#555">0.0</text>
  <line x1="250" y1="500" x2="250" y2="505" stroke="#333" stroke-width="2" />
  <text x="250" y="525" text-anchor="middle" font-size="14" fill="#555">0.2</text>
  <line x1="400" y1="500" x2="400" y2="505" stroke="#333" stroke-width="2" />
  <text x="400" y="525" text-anchor="middle" font-size="14" fill="#555">0.4</text>
  <line x1="550" y1="500" x2="550" y2="505" stroke="#333" stroke-width="2" />
  <text x="550" y="525" text-anchor="middle" font-size="14" fill="#555">0.6</text>
  <line x1="700" y1="500" x2="700" y2="505" stroke="#333" stroke-width="2" />
  <text x="700" y="525" text-anchor="middle" font-size="14" fill="#555">0.8</text>
  <line x1="850" y1="500" x2="850" y2="505" stroke="#333" stroke-width="2" />
  <text x="850" y="525" text-anchor="middle" font-size="14" fill="#555">1.0</text>

  <!-- Axis Titles -->
  <text x="475" y="560" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">Normalized Frequency (f)</text>
  <text x="40" y="290" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" transform="rotate(-90 40 290)">Severity Weight (W)</text>

  <!-- Legends -->
  <rect x="650" y="70" width="16" height="16" fill="#e74c3c" rx="4"/>
  <text x="675" y="83" font-size="14" fill="#333" font-weight="bold">D_struct (Structural)</text>
  
  <rect x="650" y="100" width="16" height="16" fill="#3498db" rx="4"/>
  <text x="675" y="113" font-size="14" fill="#333" font-weight="bold">D_exec (Execution)</text>
  
  <rect x="650" y="130" width="16" height="16" fill="#2ecc71" rx="4"/>
  <text x="675" y="143" font-size="14" fill="#333" font-weight="bold">D_comm (Communication)</text>

  <!-- Background Quadrant Highlighting (Subtle) -->
  <rect x="100" y="100" width="225" height="160" fill="#e74c3c" opacity="0.04" />
  <rect x="325" y="260" width="225" height="140" fill="#3498db" opacity="0.04" />
  <rect x="550" y="400" width="300" height="100" fill="#2ecc71" opacity="0.04" />

  <!-- Data Points D_struct (Red) -->
  <circle cx="137" cy="120" r="7" fill="#e74c3c" />
  <text x="150" y="125" font-size="14" fill="#444">Workspace Deleted (0.05, 0.95)</text>
  
  <circle cx="175" cy="160" r="7" fill="#e74c3c" />
  <text x="188" y="165" font-size="14" fill="#444">Project Archived (0.10, 0.85)</text>
  
  <circle cx="212" cy="200" r="7" fill="#e74c3c" />
  <text x="225" y="205" font-size="14" fill="#444">Member Removed (0.15, 0.75)</text>
  
  <circle cx="250" cy="240" r="7" fill="#e74c3c" />
  <text x="263" y="245" font-size="14" fill="#444">Phase Created (0.20, 0.65)</text>

  <!-- Data Points D_exec (Blue) -->
  <circle cx="362" cy="280" r="7" fill="#3498db" />
  <text x="375" y="285" font-size="14" fill="#444">Due Date Changed (0.35, 0.55)</text>
  
  <circle cx="437" cy="320" r="7" fill="#3498db" />
  <text x="450" y="325" font-size="14" fill="#444">Task Status DONE (0.45, 0.45)</text>
  
  <circle cx="400" cy="360" r="7" fill="#3498db" />
  <text x="413" y="365" font-size="14" fill="#444">Task Reassigned (0.40, 0.35)</text>
  
  <circle cx="512" cy="390" r="7" fill="#3498db" />
  <text x="525" y="395" font-size="14" fill="#444">Priority Updated (0.55, 0.28)</text>

  <!-- Data Points D_comm (Green) -->
  <circle cx="587" cy="410" r="7" fill="#2ecc71" />
  <text x="600" y="415" font-size="14" fill="#444">Attachment Uploaded (0.65, 0.22)</text>
  
  <circle cx="662" cy="440" r="7" fill="#2ecc71" />
  <text x="675" y="445" font-size="14" fill="#444">Mentioned User (0.75, 0.15)</text>

  <circle cx="737" cy="460" r="7" fill="#2ecc71" />
  <text x="750" y="465" font-size="14" fill="#444">Comment Added (0.85, 0.10)</text>
  
  <circle cx="812" cy="480" r="7" fill="#2ecc71" />
  <!-- To prevent text from being cut off on the right, position label to the left of the point -->
  <text x="797" y="485" text-anchor="end" font-size="14" fill="#444">Reaction Toggled (0.95, 0.05)</text>

</svg>
